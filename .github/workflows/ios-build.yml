name: iOS Build & Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    name: WUDCore unit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select newest available Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version
      - name: swift test
        run: swift test

  app-build:
    name: Build unsigned iOS app
    runs-on: macos-15
    needs: core-tests
    steps:
      - uses: actions/checkout@v4
      - name: Select newest available Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for iOS device (unsigned)
        run: |
          xcodebuild build \
            -project WiiUDownloaderiOS.xcodeproj \
            -scheme WiiUDownloaderiOS \
            -sdk iphoneos \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty || true
      - name: Locate .app
        id: locate
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "WiiUDownloaderiOS.app" -path "*Release-iphoneos*" | head -n1)
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
      - name: Package unsigned IPA
        run: |
          APP_PATH="${{ steps.locate.outputs.app_path }}"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r MuffinDownloader-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MuffinDownloader-unsigned-ipa
          path: MuffinDownloader-unsigned.ipa
