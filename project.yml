name: WiiUDownloaderiOS
options:
  bundleIdPrefix: com.void.muffinemu.downloader
  deploymentTarget:
    iOS: "17.0"

packages:
  WUDCore:
    path: .

targets:
  WiiUDownloaderiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/WiiUDownloaderiOS
      - path: Shared
    info:
      path: App/WiiUDownloaderiOS/Info.plist
      properties:
        CFBundleDisplayName: Muffin Downloader
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.void.muffinemu.downloader
        SWIFT_VERSION: "5.10"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: WUDCore
      - target: WiiUDownloaderWidgetExtension
        embed: true

  WiiUDownloaderWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widget
      - path: Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Muffin Downloader
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.void.muffinemu.downloader.widget
        SWIFT_VERSION: "5.10"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
